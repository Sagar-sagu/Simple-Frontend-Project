<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>signup page</title>
</head>
<body>
	<h1>Create Account</h1>

	<div>
		<form>
			<label for="stu-Fname">Enter Full Name : </label>
			<input type="text" id="stu-Fname" name="Fname" required="true"><br><br>

			<label for="stu-Uname">Create User Name : </label>
			<input type="text" id="stu-Uname" name="Uname" required="true"><br><br>

			<label for="stu-password">Create Password  : </label>
			<input type="password" id="stu-password" name="password" required="true"><br><br>

			<label for="stu-re-password">Re Enter Password: </label>
			<input type="password" id="stu-re-password" name="rePassword" required="true"><br><br>
		</form>
	</div>
</body>
</html>
